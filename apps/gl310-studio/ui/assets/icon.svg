<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="rec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <!-- Machined outer bezel -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bg)" stroke="#2A3142" stroke-width="10"/>
  <!-- Inner recessed chassis -->
  <rect x="46" y="46" width="420" height="420" rx="84" fill="#0B0D12" stroke="#1E2430" stroke-width="4"/>
  <!-- GL310 Signature Illuminated Ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#161C26" stroke-width="26"/>
  <circle cx="256" cy="256" r="144" fill="none" stroke="url(#ring)" stroke-width="20" stroke-linecap="round" stroke-dasharray="680 225" transform="rotate(-55 256 256)"/>
  <!-- Center Capture Button Core -->
  <circle cx="256" cy="256" r="88" fill="#11151E" stroke="#283142" stroke-width="5"/>
  <!-- Broadcast Record / HDMI Core Emblem -->
  <circle cx="256" cy="256" r="34" fill="url(#rec)"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="3"/>
</svg>
